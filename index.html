<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stillwater — sit by the lake</title>
<meta name="description" content="A quiet lake you can leave open all day. Rain on the water, a crackling fire, summer and winter, noon to night. A mind reset in your browser.">
<meta name="theme-color" content="#11161d">
<meta property="og:title" content="Stillwater — sit by the lake">
<meta property="og:description" content="Rain on the water, a fire at your back. A quiet lake you can leave open all day.">
<meta property="og:image" content="https://erayyavuz.github.io/stillwater/assets/og.jpg">
<meta property="og:url" content="https://erayyavuz.github.io/stillwater/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='26' r='12' fill='%23f3c98b'/%3E%3Crect x='6' y='38' width='52' height='3' rx='1.5' fill='%23cfe0ea'/%3E%3Crect x='14' y='46' width='36' height='3' rx='1.5' fill='%23cfe0ea' opacity='.7'/%3E%3Crect x='22' y='54' width='20' height='3' rx='1.5' fill='%23cfe0ea' opacity='.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="stage" aria-label="A lake at the edge of a pine forest, with a campfire on the shore"></canvas>
<div class="veil"></div>
<div class="vignette"></div>

<header class="top ui">
  <a class="brand" href="./" aria-label="Stillwater home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="4.2" fill="currentColor" opacity=".9"/><path d="M3 15.5h18M6 18.5h12M9 21.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    stillwater
  </a>
  <nav class="top-right">
    <button class="link" id="hideBtn" title="Hide everything but the lake (H)">Just the lake</button>
    <div class="sound-wrap">
      <button class="pill" id="soundBtn" aria-pressed="false"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="soundLabel">Sound off</span></button>
      <button class="pill icon" id="mixBtn" aria-label="Sound mixer" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M5 4v16M12 4v16M19 4v16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="5" cy="14" r="2.2" fill="currentColor"/><circle cx="12" cy="8" r="2.2" fill="currentColor"/><circle cx="19" cy="15" r="2.2" fill="currentColor"/></svg></button>
      <div class="mixer glass" id="mixer" hidden>
        <div class="mix-title">Mix</div>
        <label><span>Rain</span><input type="range" min="0" max="1" step="0.01" data-vol="rain"></label>
        <label><span>Fire</span><input type="range" min="0" max="1" step="0.01" data-vol="fire"></label>
        <label><span>Water</span><input type="range" min="0" max="1" step="0.01" data-vol="water"></label>
        <label><span>Wind</span><input type="range" min="0" max="1" step="0.01" data-vol="wind"></label>
        <label><span>Wildlife</span><input type="range" min="0" max="1" step="0.01" data-vol="life"></label>
        <label class="master"><span>Volume</span><input type="range" min="0" max="1" step="0.01" data-vol="master"></label>
      </div>
    </div>
  </nav>
</header>

<main class="hero ui">
  <p class="eyebrow"><span></span>A lake, open all night</p>
  <h1>Sit by the <em>water.</em></h1>
  <p class="lede">Rain on the surface, a fire at your back.<br> Touch the lake — it answers, then goes still again.</p>
  <div class="cta">
    <button class="btn primary" id="breatheBtn">Sit for a minute <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="btn ghost" id="skipBtn">Skip a stone</button>
  </div>
</main>

<footer class="hints ui">
  <span><kbd>move</kbd> part the reeds</span>
  <span><kbd>click</kbd> touch the water</span>
  <span><kbd>tap</kbd> the fire</span>
  <span><kbd>scroll</kbd> day into night</span>
</footer>

<aside class="panel glass ui" id="panel">
  <div class="seg two" role="group" aria-label="Season">
    <button data-season="summer"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Summer</button>
    <button data-season="winter"><svg viewBox="0 0 24 24"><path d="M12 2.5v19M3.8 7.25l16.4 9.5M3.8 16.75l16.4-9.5M9.5 4l2.5 2.5L14.5 4M9.5 20l2.5-2.5 2.5 2.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>Winter</button>
  </div>
  <div class="seg three" role="group" aria-label="Weather">
    <button data-weather="clear"><svg viewBox="0 0 24 24"><path d="M7 17.5h10a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 7 10.5a3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>Clear</button>
    <button data-weather="rain"><svg viewBox="0 0 24 24"><path d="M7 13.5h10a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 7 6.5a3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 16.5l-1 3M12 16.5l-1 3M16 16.5l-1 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Rain</button>
    <button data-weather="snow"><svg viewBox="0 0 24 24"><path d="M7 13.5h10a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 7 6.5a3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="8" cy="18" r="1" fill="currentColor"/><circle cx="12" cy="20" r="1" fill="currentColor"/><circle cx="16" cy="18" r="1" fill="currentColor"/></svg>Snow</button>
  </div>
  <div class="light">
    <div class="light-head"><span class="cap">Light</span><span class="light-name" id="lightName">Golden</span></div>
    <svg id="dial" viewBox="0 0 240 80" role="slider" aria-label="Time of day" tabindex="0">
      <path id="arc" d="M14 16 Q120 22 226 64" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.4" stroke-dasharray="1.5 5" stroke-linecap="round"/>
      <line x1="10" y1="76" x2="230" y2="76" stroke="rgba(255,255,255,.18)"/>
      <circle id="knobGlow" r="14" fill="rgba(255,240,210,.18)"/>
      <circle id="knob" r="7.5" fill="#fff8ec"/>
    </svg>
    <div class="light-labels"><button data-tod="0">Noon</button><button data-tod="1">Golden</button><button data-tod="2">Dusk</button><button data-tod="3">Night</button></div>
  </div>
</aside>

<button class="btn customize ui" id="customizeBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 10.5-10.5a2.1 2.1 0 0 0-3-3L5 16l-1 4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Customize</button>

<div class="breath" id="breath" aria-live="polite" hidden>
  <div class="ring"><div class="core"></div></div>
  <p class="breath-word" id="breathWord">Breathe in</p>
  <p class="breath-sub" id="breathSub">six slow breaths</p>
  <button class="link back" id="breathBack">I'm back</button>
</div>

<button class="showui" id="showUi" hidden>Show controls</button>

<noscript><p class="nojs">Stillwater needs JavaScript and WebGL to draw the lake.</p></noscript>
<script type="module" src="src/main.js?v=3"></script>
</body>
</html>
